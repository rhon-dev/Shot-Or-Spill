name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typecheck, card validation, WCAG contrast check, unit tests.
      - run: npm run check
      # Build (re-validates cards) and enforce the 150 KB gzipped JS budget (D-18).
      - run: npm run build
      - run: npm run size
