<text x="20" y="42" class="d" font-size="15" fill="#ABA7BA" letter-spacing="1.2">NOW READING</text><rect x="176.39999999999998" y="20" width="163.60000000000002" height="34" rx="17" fill="#0B0A10" stroke="#22D3C5" stroke-width="1.5"/><path d="M191.71399999999997 34.6 L201.08599999999998 34.6 L200.03599999999997 42.1 L192.76399999999998 42.1 Z" fill="#FFB020"/><path d="M191.86399999999998 42.1 L200.93599999999998 42.1 L200.59999999999997 44.5 L192.2 44.5 Z" fill="#F5F3FA" opacity="0.35"/><path d="M190.09999999999997 29.5 L202.7 29.5 L200.59999999999997 44.5 L192.2 44.5 Z" fill="none" stroke="#F5F3FA" stroke-width="1.5" stroke-linejoin="round"/><text x="210.39999999999998" y="42" class="s" font-size="14" font-weight="700" fill="#22D3C5">Tanggero: Maria</text><text x="20" y="98" class="d" font-size="46" fill="#F5F3FA">JESSA</text><rect x="20" y="118" width="320" height="304" rx="24" fill="#17151F" stroke="#22D3C5" stroke-width="2"/><rect x="40" y="138" width="103" height="28" rx="14" fill="#22D3C5"/><text x="53" y="157" class="d" font-size="14" fill="#0B0A10" letter-spacing="1">BARKADA TEA</text><text x="320" y="158" class="d" font-size="15" fill="#ABA7BA" text-anchor="end" letter-spacing="1.2">HOT SEAT</text><text x="180" y="244.75" class="s" font-size="21" font-weight="800" fill="#F5F3FA" text-anchor="middle">Hot Seat: Bea answers</text><text x="180" y="270.37" class="s" font-size="21" font-weight="800" fill="#F5F3FA" text-anchor="middle">three questions from</text><text x="180" y="295.99" class="s" font-size="21" font-weight="800" fill="#F5F3FA" text-anchor="middle">the group about their</text><text x="180" y="321.61" class="s" font-size="21" font-weight="800" fill="#F5F3FA" text-anchor="middle">oldest friendship. One</text><text x="180" y="347.23" class="s" font-size="21" font-weight="800" fill="#F5F3FA" text-anchor="middle">shot skips one.</text><text x="20" y="450" class="d" font-size="15" fill="#ABA7BA" letter-spacing="1.2">SHOTS BEA TOOK</text><rect x="20" y="462" width="60" height="60" rx="14" fill="none" stroke="#726C88" stroke-width="2"/><path d="M4 10 H16" transform="translate(39 481) scale(1.1)" fill="none" stroke="#F5F3FA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><text x="180" y="506" class="d" font-size="40" fill="#F5F3FA" text-anchor="middle">1</text><rect x="280" y="462" width="60" height="60" rx="14" fill="none" stroke="#726C88" stroke-width="2"/><path d="M10 4 V16 M4 10 H16" transform="translate(299 481) scale(1.1)" fill="none" stroke="#F5F3FA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><text x="180" y="550" class="s" font-size="14" font-weight="500" fill="#ABA7BA" text-anchor="middle">0 to 3. Each answered question counts as a spill.</text><rect x="20" y="590" width="320" height="64" rx="14" fill="#22D3C5"/><text x="180" y="625.36" class="d" font-size="28" fill="#0B0A10" text-anchor="middle" letter-spacing="1">DONE</text><text x="180" y="644.36" class="s" font-size="13" font-weight="600" fill="#0B0A10" text-anchor="middle">Logs 1 shot and 2 spills for Bea</text><path d="M4 4 L10 10 L4 16 M11 4 L17 10 L11 16" transform="translate(43.33333333333334 686) scale(1)" fill="none" stroke="#ABA7BA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><text x="73.33333333333334" y="702" class="s" font-size="15" font-weight="600" fill="#ABA7BA">Skip</text><path d="M7 4 L3 8 L7 12 M3 8 H12 A5 5 0 0 1 12 18 H8" transform="translate(150 686) scale(1)" fill="none" stroke="#ABA7BA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><text x="180" y="702" class="s" font-size="15" font-weight="600" fill="#ABA7BA">Undo</text><path d="M4 17 V11 M10 17 V4 M16 17 V8" transform="translate(249.16666666666669 686) scale(1)" fill="none" stroke="#ABA7BA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><text x="279.1666666666667" y="702" class="s" font-size="15" font-weight="600" fill="#ABA7BA">Scores</text>
