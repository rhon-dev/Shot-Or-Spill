<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800" role="img" aria-label="Shot or Spill mock: Info page template: Drink Responsibly">
<title>Shot or Spill mock: Info page template: Drink Responsibly</title>
<style>.d{font-family:Anton, Impact, 'Arial Narrow Bold', sans-serif}.s{font-family:'Inter Variable', Inter, 'Helvetica Neue', Arial, sans-serif}</style>
<defs>
<filter id="glow" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="360" height="800" fill="#0B0A10"/>
<path d="M13 4 L7 10 L13 16" transform="translate(16 26) scale(1.3)" fill="none" stroke="#F5F3FA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><text x="20" y="112" class="d" font-size="36" fill="#F5F3FA">DRINK RESPONSIBLY</text><text x="20" y="160" class="d" font-size="15" fill="#22D3C5" letter-spacing="1.2">THE PLEDGE</text><text x="20" y="188" class="s" font-size="16" font-weight="500" fill="#F5F3FA">No one drives tonight. Skipping is</text><text x="20" y="211.2" class="s" font-size="16" font-weight="500" fill="#F5F3FA">always okay. Drink water.</text><text x="20" y="256.4" class="d" font-size="15" fill="#22D3C5" letter-spacing="1.2">WHAT'S A SHOT</text><text x="20" y="284.4" class="s" font-size="16" font-weight="500" fill="#F5F3FA">A small tagay-sized pour, not a full</text><text x="20" y="307.59999999999997" class="s" font-size="16" font-weight="500" fill="#F5F3FA">glass.</text><text x="20" y="352.79999999999995" class="d" font-size="15" fill="#22D3C5" letter-spacing="1.2">PACE YOURSELF</text><text x="20" y="380.79999999999995" class="s" font-size="16" font-weight="500" fill="#F5F3FA">A Water Break comes up every 12 to 15</text><text x="20" y="403.99999999999994" class="s" font-size="16" font-weight="500" fill="#F5F3FA">cards. When someone reaches 6 shots, the</text><text x="20" y="427.19999999999993" class="s" font-size="16" font-weight="500" fill="#F5F3FA">app suggests a water round. You can</text><text x="20" y="450.4" class="s" font-size="16" font-weight="500" fill="#F5F3FA">change that number on the scoreboard.</text><text x="20" y="495.59999999999997" class="d" font-size="15" fill="#22D3C5" letter-spacing="1.2">GET HOME SAFE</text><text x="20" y="523.5999999999999" class="s" font-size="16" font-weight="500" fill="#F5F3FA">Book a ride, stay over at the host's</text><text x="20" y="546.8" class="s" font-size="16" font-weight="500" fill="#F5F3FA">place, or take turns being the sober</text><text x="20" y="569.9999999999999" class="s" font-size="16" font-weight="500" fill="#F5F3FA">one. Nobody drives after drinking.</text><rect x="20" y="605.1999999999999" width="320" height="1" rx="0" fill="#2E2A3D"/><text x="20" y="623.1999999999999" class="s" font-size="13" font-weight="500" fill="#ABA7BA">Shot or Spill is for adults 18+. It's for</text><text x="20" y="641.4" class="s" font-size="13" font-weight="500" fill="#ABA7BA">entertainment only and doesn't sell alcohol.</text><text x="20" y="659.5999999999999" class="s" font-size="13" font-weight="500" fill="#ABA7BA">Players are responsible for themselves.</text><text x="20" y="687.8" class="s" font-size="14" font-weight="600" fill="#22D3C5">About  ·  Terms</text>
</svg>
