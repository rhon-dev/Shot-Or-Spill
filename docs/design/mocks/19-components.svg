="376" y="836" class="s" font-size="13" font-weight="500" fill="#ABA7BA">Shows for 3 s after Undo, announced to screen readers.</text><text x="24" y="900" class="d" font-size="20" fill="#22D3C5" letter-spacing="1">DECK TILES</text><rect x="24" y="918" width="312" height="72" rx="14" fill="#17151F" stroke="#C58BFF" stroke-width="2"/><rect x="38" y="932" width="44" height="44" rx="12" fill="#C58BFF"/><text x="60" y="962" font-size="22" text-anchor="middle">💔</text><text x="96" y="950" class="d" font-size="21" fill="#F5F3FA" letter-spacing="0.6">LOVE LIFE</text><text x="96" y="972" class="s" font-size="13" font-weight="500" fill="#ABA7BA">26 cards · Exes, ghosting</text><circle cx="308" cy="943" r="14" fill="#C58BFF"/><path d="M4 10.5 L8.5 15 L16 6" transform="translate(299 934) scale(0.9)" fill="none" stroke="#0B0A10" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><rect x="24" y="1000" width="312" height="72" rx="14" fill="#17151F" stroke="#2E2A3D" stroke-width="1.5"/><rect x="38" y="1014" width="44" height="44" rx="12" fill="#FF6A3D"/><text x="60" y="1044" font-size="22" text-anchor="middle">🔞</text><text x="96" y="1032" class="d" font-size="21" fill="#F5F3FA" letter-spacing="0.6">NO FILTER</text><rect x="203.9" y="1015" width="38" height="22" rx="11" fill="none" stroke="#FF6A3D" stroke-width="1.5"/><text x="222.9" y="1031" class="d" font-size="13" fill="#FF6A3D" text-anchor="middle">18+</text><text x="96" y="1054" class="s" font-size="13" font-weight="500" fill="#ABA7BA">1 card · Regrets, secrets</text><circle cx="308" cy="1025" r="13" fill="none" stroke="#726C88" stroke-width="2"/><text x="376" y="900" class="d" font-size="20" fill="#22D3C5" letter-spacing="1">DECK ACCENTS</text><rect x="376" y="918" width="26" height="26" rx="6" fill="#B6F24A"/><text x="414" y="937" class="s" font-size="14" font-weight="600" fill="#F5F3FA">Warm Up  #B6F24A</text><rect x="376" y="952" width="26" height="26" rx="6" fill="#22D3C5