who answers.</text><text x="376" y="228" class="d" font-size="20" fill="#22D3C5" letter-spacing="1">TEXT INPUT</text><rect x="376" y="246" width="312" height="54" rx="14" fill="#17151F" stroke="#726C88" stroke-width="1.5"/><text x="392" y="279" class="s" font-size="17" font-weight="500" fill="#ABA7BA">Player name</text><rect x="376" y="312" width="312" height="54" rx="14" fill="#17151F" stroke="#22D3C5" stroke-width="2"/><text x="392" y="345" class="s" font-size="17" font-weight="600" fill="#F5F3FA">Paolo</text><rect x="376" y="378" width="312" height="54" rx="14" fill="#17151F" stroke="#FF6B6B" stroke-width="2"/><text x="392" y="411" class="s" font-size="17" font-weight="600" fill="#F5F3FA">Maria</text><text x="376" y="454" class="s" font-size="14" font-weight="600" fill="#FF6B6B">That name is already in.</text><text x="376" y="476" class="s" font-size="13" font-weight="500" fill="#ABA7BA">Default · focused · error. Names: 1 to 16 characters.</text><text x="376" y="508" class="d" font-size="20" fill="#22D3C5" letter-spacing="1">BADGES</text><rect x="382.4" y="526" width="163.60000000000002" height="34" rx="17" fill="#0B0A10" stroke="#22D3C5" stroke-width="1.5"/><path d="M397.71399999999994 540.6 L407.086 540.6 L406.036 548.1 L398.76399999999995 548.1 Z" fill="#FFB020"/><path d="M397.864 548.1 L406.936 548.1 L406.59999999999997 550.5 L398.2 550.5 Z" fill="#F5F3FA" opacity="0.35"/><path d="M396.09999999999997 535.5 L408.7 535.5 L406.59999999999997 550.5 L398.2 550.5 Z" fill="none" stroke="#F5F3FA" stroke-width="1.5" stroke-linejoin="round"/><text x="416.4" y="548" class="s" font-size="14" font-weight="700" fill="#22D3C5">Tanggero: Maria</text><rect x="562" y="530" width="54" height="26" rx="13" fill="none" stroke="#FF6A3D" stroke-width="1.5"/><text x="589" y="548" class="d" font-size="14" fill="#FF6A3D" text-anchor="middle">18+</text><text x="376" y="588" class="d" font-size="20" fill="#22D3C5" letter-spacing="1">INTENSITY · STEPPER · TOGGLE</text><rect x="376" y="60