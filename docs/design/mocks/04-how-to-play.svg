<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800" role="img" aria-label="Shot or Spill mock: How to Play (first time only)">
<title>Shot or Spill mock: How to Play (first time only)</title>
<style>.d{font-family:Anton, Impact, 'Arial Narrow Bold', sans-serif}.s{font-family:'Inter Variable', Inter, 'Helvetica Neue', Arial, sans-serif}</style>
<defs>
<filter id="glow" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="360" height="800" fill="#0B0A10"/>
<path d="M13 4 L7 10 L13 16" transform="translate(16 26) scale(1.3)" fill="none" stroke="#F5F3FA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><text x="20" y="112" class="d" font-size="36" fill="#F5F3FA">HOW TO PLAY</text><circle cx="34" cy="152" r="14" fill="#22D3C5"/><text x="34" y="158" class="d" font-size="16" fill="#0B0A10" text-anchor="middle">1</text><text x="62" y="158" class="s" font-size="16" font-weight="500" fill="#F5F3FA">Pass the phone. Whoever holds it</text><text x="62" y="180.4" class="s" font-size="16" font-weight="500" fill="#F5F3FA">draws the card.</text><circle cx="34" cy="210.8" r="14" fill="#22D3C5"/><text x="34" y="216.8" class="d" font-size="16" fill="#0B0A10" text-anchor="middle">2</text><text x="62" y="216.8" class="s" font-size="16" font-weight="500" fill="#F5F3FA">Read the card out loud.</text><circle cx="34" cy="258.8" r="14" fill="#22D3C5"/><text x="34" y="264.8" class="d" font-size="16" fill="#0B0A10" text-anchor="middle">3</text><text x="62" y="264.8" class="s" font-size="16" font-weight="500" fill="#F5F3FA">Spill (answer honestly) or Shot</text><text x="62" y="287.2" class="s" font-size="16" font-weight="500" fill="#F5F3FA">(drink and keep your secret).</text><circle cx="34" cy="317.6" r="14" fill="#22D3C5"/><text x="34" y="323.6" class="d" font-size="16" fill="#0B0A10" text-anchor="middle">4</text><text x="62" y="323.6" class="s" font-size="16" font-weight="500" fill="#F5F3FA">Too vague? The group decides. If</text><text x="62" y="346" class="s" font-size="16" font-weight="500" fill="#F5F3FA">it is, that person drinks.</text><circle cx="34" cy="376.40000000000003" r="14" fill="#22D3C5"/><text x="34" y="382.40000000000003" class="d" font-size="16" fill="#0B0A10" text-anchor="middle">5</text><text x="62" y="382.40000000000003" class="s" font-size="16" font-weight="500" fill="#F5F3FA">Tap Spill or Shot, then pass the</text><text x="62" y="404.8" class="s" font-size="16" font-weight="500" fill="#F5F3FA">phone.</text><rect x="20" y="437.20000000000005" width="320" height="106.8" rx="14" fill="#17151F" stroke="#22D3C5" stroke-width="1.5"/><path d="M41.953 466.40000000000003 L62.047 466.40000000000003 L59.947 481.40000000000003 L44.053 481.40000000000003 Z" fill="#FFB020"/><path d="M42.928 481.40000000000003 L61.072 481.40000000000003 L60.4 486.20000000000005 L43.6 486.20000000000005 Z" fill="#F5F3FA" opacity="0.35"/><path d="M39.4 456.20000000000005 L64.6 456.20000000000005 L60.4 486.20000000000005 L43.6 486.20000000000005 Z" fill="none" stroke="#F5F3FA" stroke-width="1.875" stroke-linejoin="round"/><text x="82" y="467.20000000000005" class="d" font-size="15" fill="#22D3C5" letter-spacing="1.2">THE TANGGERO</text><text x="82" y="487.20000000000005" class="s" font-size="14" font-weight="500" fill="#ABA7BA">Pours for the table. The app picks</text><text x="82" y="506.80000000000007" class="s" font-size="14" font-weight="500" fill="#ABA7BA">one now and passes the role every</text><text x="82" y="526.4000000000001" class="s" font-size="14" font-weight="500" fill="#ABA7BA">10 cards.</text><rect x="20" y="556" width="320" height="87.19999999999999" rx="14" fill="#17151F" stroke="#FFB020" stroke-width="1.5"/><text x="40" y="586" class="d" font-size="15" fill="#FFB020" letter-spacing="1.2">WHAT'S A SHOT?</text><text x="40" y="606" class="s" font-size="14" font-weight="500" fill="#ABA7BA">A small tagay-sized pour, not a full</text><text x="40" y="625.6" class="s" font-size="14" font-weight="500" fill="#ABA7BA">glass. Skipping a card is always okay.</text><rect x="20" y="712" width="320" height="64" rx="14" fill="#22D3C5"/><text x="180" y="754.08" class="d" font-size="28" fill="#0B0A10" text-anchor="middle" letter-spacing="1">LET'S GO</text>
</svg>
