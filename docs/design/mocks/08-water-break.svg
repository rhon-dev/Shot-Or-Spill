<text x="20" y="42" class="d" font-size="15" fill="#ABA7BA" letter-spacing="1.2">NOW READING</text><rect x="176.39999999999998" y="20" width="163.60000000000002" height="34" rx="17" fill="#0B0A10" stroke="#22D3C5" stroke-width="1.5"/><path d="M191.71399999999997 34.6 L201.08599999999998 34.6 L200.03599999999997 42.1 L192.76399999999998 42.1 Z" fill="#FFB020"/><path d="M191.86399999999998 42.1 L200.93599999999998 42.1 L200.59999999999997 44.5 L192.2 44.5 Z" fill="#F5F3FA" opacity="0.35"/><path d="M190.09999999999997 29.5 L202.7 29.5 L200.59999999999997 44.5 L192.2 44.5 Z" fill="none" stroke="#F5F3FA" stroke-width="1.5" stroke-linejoin="round"/><text x="210.39999999999998" y="42" class="s" font-size="14" font-weight="700" fill="#22D3C5">Tanggero: Maria</text><text x="20" y="98" class="d" font-size="46" fill="#F5F3FA">BEA</text><rect x="20" y="118" width="320" height="410" rx="24" fill="#17151F" stroke="#22D3C5" stroke-width="2"/><rect x="40" y="138" width="103" height="28" rx="14" fill="#22D3C5"/><text x="53" y="157" class="d" font-size="14" fill="#0B0A10" letter-spacing="1">WATER BREAK</text><text x="320" y="158" class="d" font-size="15" fill="#ABA7BA" text-anchor="end" letter-spacing="1.2">PACING</text><path d="M163.18933333333334 217.2 Q171.59466666666665 214 180 217.2 T196.81066666666666 217.2 L193.22666666666666 259.8666666666667 L166.77333333333334 259.8666666666667 Z" fill="#22D3C5" opacity="0.9"/><path d="M159.52 198 L200.48 198 L195.36 262 L164.64 262 Z" fill="none" stroke="#F5F3FA" stroke-width="3.5555555555555554" stroke-linejoin="round"/><text x="180" y="304.35999999999996" class="s" font-size="24" font-weight="800" fill="#F5F3FA" text-anchor="middle">Water Break.</text><text x="180" y="333.64" class="s" font-size="24" font-weight="800" fill="#F5F3FA" text-anchor="middle">Everyone drinks a</text><text x="180" y="362.91999999999996" class="s" font-size="24" font-weight="800" fill="#F5F3FA" text-anchor="middle">glass of water</text><text x="180" y="392.19999999999993" class="s" font-size="24" font-weight="800" fill="#F5F3FA" text-anchor="middle">before the next</text><text x="180" y="421.47999999999996" class="s" font-size="24" font-weight="800" fill="#F5F3FA" text-anchor="middle">card. The night is</text><text x="180" y="450.76" class="s" font-size="24" font-weight="800" fill="#F5F3FA" text-anchor="middle">still young.</text><text x="180" y="504" class="s" font-size="14" font-weight="500" fill="#ABA7BA" text-anchor="middle">Pacing card. No exceptions.</text><rect x="20" y="548" width="320" height="72" rx="14" fill="#22D3C5"/><text x="180" y="587.36" class="d" font-size="28" fill="#0B0A10" text-anchor="middle" letter-spacing="1">DONE · NEXT CARD</text><text x="180" y="606.36" class="s" font-size="13" font-weight="600" fill="#0B0A10" text-anchor="middle">Nothing is logged</text><path d="M7 4 L3 8 L7 12 M3 8 H12 A5 5 0 0 1 12 18 H8" transform="translate(70 654) scale(1)" fill="none" stroke="#ABA7BA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><text x="100" y="670" class="s" font-size="15" font-weight="600" fill="#ABA7BA">Undo</text><path d="M4 17 V11 M10 17 V4 M16 17 V8" transform="translate(222.5 654) scale(1)" fill="none" stroke="#ABA7BA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><text x="252.5" y="670" class="s" font-size="15" font-weight="600" fill="#ABA7BA">Scores</text>
