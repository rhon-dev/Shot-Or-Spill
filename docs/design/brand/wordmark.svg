<svg xmlns="http://www.w3.org/2000/svg" width="320" height="276" viewBox="0 0 320 276" role="img" aria-label="Shot or Spill wordmark">
<title>Shot or Spill wordmark</title>
<style>.d{font-family:Anton, Impact, 'Arial Narrow Bold', sans-serif}.s{font-family:'Inter Variable', Inter, 'Helvetica Neue', Arial, sans-serif}</style>
<defs>
<filter id="glow" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="320" height="276" fill="#0B0A10"/>
<g filter="url(#glow)"><text x="160" y="111.03999999999999" class="d" font-size="96" fill="#FFB020" text-anchor="middle" letter-spacing="2.88">SHOT</text><text x="160" y="153.28" class="s" font-size="36.480000000000004" font-weight="800" fill="#F5F3FA" text-anchor="middle">or</text><text x="160" y="235.84" class="d" font-size="96" fill="#FF2E88" text-anchor="middle" letter-spacing="2.88">SPILL</text></g>
</svg>
